services:
  langfuse-server:
    image: ghcr.io/langfuse/langfuse:2
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3050:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - SALT=${SALT}
      - NEXTAUTH_URL=http://localhost:3050
      - TELEMETRY_ENABLED=false
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  webhook-bridge:
    image: python:3.12-slim
    depends_on:
      langfuse-server:
        condition: service_healthy
    volumes:
      - ./webhook-bridge.py:/app/webhook-bridge.py:ro
    environment:
      - LANGFUSE_URL=http://langfuse-server:3000
      - LANGFUSE_API_KEY=${LANGFUSE_API_KEY:-}
      - OMO_WEBHOOK_URL=${OMO_WEBHOOK_URL:-http://host.docker.internal:9100/webhook}
      - POLL_INTERVAL=${POLL_INTERVAL:-60}
    command: ["python", "/app/webhook-bridge.py"]
    restart: unless-stopped

  db:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  database_data:
    driver: local
